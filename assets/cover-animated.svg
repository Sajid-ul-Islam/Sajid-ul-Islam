<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Animated Gradient Background -->
    <linearGradient id="animatedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a">
        <animate attributeName="stop-color" values="#1e3a8a;#3b82f6;#06b6d4;#1e3a8a" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#06b6d4;#1e3a8a;#3b82f6" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#1e3a8a;#3b82f6;#06b6d4" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Particle Style -->
    <style type="text/css">
      <![CDATA[
        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.8; transform: scale(1.02); }
        }
        @keyframes float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-15px); }
        }
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .title { animation: pulse 3s ease-in-out infinite; }
        .subtitle { animation: fadeIn 1s ease-out 0.5s forwards; }
        .tagline { animation: fadeIn 1s ease-out 0.8s forwards; }
        .particle { animation: float 4.5s ease-in-out infinite; }
        .js-label { animation: pulse 2s ease-in-out infinite 1s; }
      ]]>
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#animatedGradient)" />
  
  <!-- Floating Particles (JavaScript-generated positions) -->
  <circle cx="100" cy="100" r="4" fill="rgba(255, 255, 255, 0.6)" class="particle" style="animation-delay: 0s; animation-duration: 4s;" />
  <circle cx="200" cy="150" r="3" fill="rgba(255, 255, 255, 0.6)" class="particle" style="animation-delay: 0.5s; animation-duration: 5s;" />
  <circle cx="300" cy="80" r="5" fill="rgba(255, 255, 255, 0.6)" class="particle" style="animation-delay: 1s; animation-duration: 3.5s;" />
  <circle cx="400" cy="200" r="3" fill="rgba(255, 255, 255, 0.6)" class="particle" style="animation-delay: 1.5s; animation-duration: 4.5s;" />
  <circle cx="500" cy="50" r="4" fill="rgba(255, 255, 255, 0.6)" class="particle" style="animation-delay: 2s; animation-duration: 3.8s;" />
  <circle cx="600" cy="180" r="3" fill="rgba(255, 255, 255, 0.6)" class="particle" style="animation-delay: 0.3s; animation-duration: 5.2s;" />
  <circle cx="700" cy="120" r="5" fill="rgba(255, 255, 255, 0.6)" class="particle" style="animation-delay: 1.8s; animation-duration: 4s;" />
  <circle cx="800" cy="200" r="4" fill="rgba(255, 255, 255, 0.6)" class="particle" style="animation-delay: 0.7s; animation-duration: 4.8s;" />
  <circle cx="900" cy="70" r="3" fill="rgba(255, 255, 255, 0.6)" class="particle" style="animation-delay: 1.2s; animation-duration: 3.5s;" />
  <circle cx="1000" cy="150" r="4" fill="rgba(255, 255, 255, 0.6)" class="particle" style="animation-delay: 0.9s; animation-duration: 5s;" />
  <circle cx="1100" cy="100" r="3" fill="rgba(255, 255, 255, 0.6)" class="particle" style="animation-delay: 1.5s; animation-duration: 4.2s;" />
  <circle cx="150" cy="300" r="4" fill="rgba(255, 255, 255, 0.6)" class="particle" style="animation-delay: 0.2s; animation-duration: 4.5s;" />
  <circle cx="250" cy="250" r="3" fill="rgba(255, 255, 255, 0.6)" class="particle" style="animation-delay: 1.7s; animation-duration: 3.8s;" />
  <circle cx="350" cy="350" r="5" fill="rgba(255, 255, 255, 0.6)" class="particle" style="animation-delay: 0.8s; animation-duration: 4s;" />
  <circle cx="450" cy="300" r="3" fill="rgba(255, 255, 255, 0.6)" class="particle" style="animation-delay: 1.3s; animation-duration: 5s;" />
  
  <!-- Main Content -->
  <g transform="translate(600, 337.5)" text-anchor="middle">
    <!-- Title with Pulse Animation -->
    <text x="0" y="-120" class="title" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">Sajid Islam</text>
    
    <!-- Subtitle with Fade In -->
    <text x="0" y="-40" class="subtitle" font-family="'Segoe UI', Arial, sans-serif" font-size="36" fill="rgba(255, 255, 255, 0.9)">Co-Founder at CybrCraft &#183; Forward Deployed Engineer</text>
    
    <!-- Tagline with Fade In -->
    <text x="0" y="40" class="tagline" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="rgba(255, 255, 255, 0.8)">Building AI-driven applications & scalable systems</text>
    
    <!-- Contact Info -->
    <text x="0" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="rgba(255, 255, 255, 0.7)">
      Portfolio: sajid-ul-islam.vercel.app &nbsp;&nbsp;|&nbsp;&nbsp; LinkedIn: @sajidislamchowdhury
    </text>
  </g>
  
  <!-- JavaScript Powered Label -->
  <g transform="translate(1050, 650)" text-anchor="end">
    <rect x="-120" y="-25" width="120" height="30" rx="15" fill="rgba(0, 0, 0, 0.5)" />
    <text x="0" y="0" class="js-label" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#06b6d4" font-weight="bold">
      <tspan x="0" dy="5">⚡ Powered by JavaScript</tspan>
    </text>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="500" r="8" fill="rgba(6, 182, 212, 0.8)" class="particle" style="animation-delay: 0s; animation-duration: 6s;" />
  <circle cx="1100" cy="550" r="6" fill="rgba(59, 130, 246, 0.8)" class="particle" style="animation-delay: 1s; animation-duration: 5s;" />
  <circle cx="200" cy="500" r="5" fill="rgba(30, 58, 138, 0.8)" class="particle" style="animation-delay: 2s; animation-duration: 4s;" />
  <circle cx="1000" cy="450" r="7" fill="rgba(6, 182, 212, 0.8)" class="particle" style="animation-delay: 0.5s; animation-duration: 5.5s;" />
</svg>
