<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Static Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Glow Filter for JS label -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  
  <!-- Static Particles (decorative) -->
  <circle cx="100" cy="100" r="4" fill="rgba(255, 255, 255, 0.6)" />
  <circle cx="200" cy="150" r="3" fill="rgba(255, 255, 255, 0.6)" />
  <circle cx="300" cy="80" r="5" fill="rgba(255, 255, 255, 0.6)" />
  <circle cx="400" cy="200" r="3" fill="rgba(255, 255, 255, 0.6)" />
  <circle cx="500" cy="50" r="4" fill="rgba(255, 255, 255, 0.6)" />
  <circle cx="600" cy="180" r="3" fill="rgba(255, 255, 255, 0.6)" />
  <circle cx="700" cy="120" r="5" fill="rgba(255, 255, 255, 0.6)" />
  <circle cx="800" cy="200" r="4" fill="rgba(255, 255, 255, 0.6)" />
  <circle cx="900" cy="70" r="3" fill="rgba(255, 255, 255, 0.6)" />
  <circle cx="1000" cy="150" r="4" fill="rgba(255, 255, 255, 0.6)" />
  <circle cx="1100" cy="100" r="3" fill="rgba(255, 255, 255, 0.6)" />
  <circle cx="150" cy="300" r="4" fill="rgba(255, 255, 255, 0.6)" />
  <circle cx="250" cy="250" r="3" fill="rgba(255, 255, 255, 0.6)" />
  <circle cx="350" cy="350" r="5" fill="rgba(255, 255, 255, 0.6)" />
  <circle cx="450" cy="300" r="3" fill="rgba(255, 255, 255, 0.6)" />
  
  <!-- Main Content -->
  <g transform="translate(600, 337.5)" text-anchor="middle">
    <!-- Title -->
    <text x="0" y="-120" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">Sajid Islam</text>
    
    <!-- Subtitle -->
    <text x="0" y="-40" font-family="'Segoe UI', Arial, sans-serif" font-size="36" fill="rgba(255, 255, 255, 0.9)">Co-Founder at CybrCraft &middot; Forward Deployed Engineer</text>
    
    <!-- Tagline -->
    <text x="0" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="rgba(255, 255, 255, 0.8)">Building AI-driven applications & scalable systems</text>
    
    <!-- Contact Info -->
    <text x="0" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="rgba(255, 255, 255, 0.7)">
      Portfolio: sajid-ul-islam.vercel.app &nbsp;&nbsp;|&nbsp;&nbsp; LinkedIn: @sajidislamchowdhury
    </text>
  </g>
  
  <!-- JavaScript Powered Label -->
  <g transform="translate(1050, 650)" text-anchor="end">
    <rect x="-120" y="-25" width="120" height="30" rx="15" fill="rgba(0, 0, 0, 0.5)" />
    <text x="0" y="0" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#06b6d4" font-weight="bold" dy="5">
      ⚡ Powered by JavaScript
    </text>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="500" r="8" fill="rgba(6, 182, 212, 0.8)" />
  <circle cx="1100" cy="550" r="6" fill="rgba(59, 130, 246, 0.8)" />
  <circle cx="200" cy="500" r="5" fill="rgba(30, 58, 138, 0.8)" />
  <circle cx="1000" cy="450" r="7" fill="rgba(6, 182, 212, 0.8)" />
</svg>
