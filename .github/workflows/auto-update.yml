name: Update profile README

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Refresh timestamp
        run: |
          timestamp="$(date -u +"%Y-%m-%d %H:%M UTC")"
          sed -i "s|<!-- LAST_UPDATED -->.*|<!-- LAST_UPDATED --> Last refreshed: ${timestamp}|" README.md

      - name: Commit and push when changed
        run: |
          if git diff --quiet; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh profile timestamp"
          git push
